[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgqa"
version = "0.1.0"
description = "ChaosGraphQA - A randomized benchmark for testing LLM reasoning capabilities"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ChaosGraphQA Contributors"}
]
keywords = ["benchmark", "reasoning", "llm", "knowledge-graph", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "networkx>=2.8",
    "pydantic>=2.0",
    "click>=8.0",
    "numpy>=1.20",
    "pyyaml>=6.0",
    "rich>=12.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=1.0",
    "pre-commit>=2.0",
]
viz = [
    "matplotlib>=3.5",
    "plotly>=5.0",
    "pandas>=1.5",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.7", 
    "google-generativeai>=0.3.0",
    "transformers>=4.20.0",
    "torch>=1.12.0",
    "requests>=2.28",
]

[project.scripts]
cgqa = "cgqa.cli.main:cli"

[project.urls]
Homepage = "https://github.com/your-org/cgqa"
Repository = "https://github.com/your-org/cgqa"
Issues = "https://github.com/your-org/cgqa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"