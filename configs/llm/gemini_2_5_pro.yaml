# Gemini 2.5 Pro configuration
# Long context analysis, complex reasoning, code/math support
# 1M input tokens, 65K output tokens
# Knowledge cutoff: January 2025

provider_name: "gemini"
model_name: "gemini-2.5-pro"
api_key: "${GOOGLE_API_KEY}"  # Environment variable
temperature: 0.1
max_tokens: 1000
timeout: 60

# Gemini-specific parameters
extra_params:
  top_p: 0.95
  top_k: 40
