# Claude Haiku 3 configuration
# Fast and compact model
# 200K context window
# Training data cutoff: August 2023
provider_name: "anthropic"
model_name: "claude-3-haiku-20240307"
api_key: "${ANTHROPIC_API_KEY}"  # Environment variable
temperature: 0.1
max_tokens: 1000
timeout: 30
rate_limit_delay: 0.2

# Anthropic-specific parameters
extra_params:
  top_p: 1.0
  top_k: 40
