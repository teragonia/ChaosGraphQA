# GPT-5 configuration
# Full-capability reasoning model for high-quality general tasks
# 400K context window
# Training data cutoff: September 2024
# Pricing: $1.25/1M input, $10/1M output tokens
provider_name: "openai"
model_name: "gpt-5"
api_key: "${OPENAI_API_KEY}"  # Environment variable
temperature: 0.1
max_tokens: 1000
timeout: 60

# GPT-5 supports reasoning_effort and verbosity parameters
extra_params:
  # verbosity: "medium"  # Options: low, medium, high
  # reasoning_effort: "medium"  # Options: minimal, medium, high
