<svg width="100%" viewBox="0 0 680 195" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ChaosGraphQA Banner</title>
  <desc>Chaotic space-themed knowledge graph banner for ChaosGraphQA.</desc>

  <style>
    @keyframes pulse { 0%,100%{opacity:.82} 50%{opacity:1} }
    @keyframes flicker { 0%,100%{opacity:1} 42%{opacity:.65} 44%{opacity:1} 78%{opacity:.75} 80%{opacity:1} }
    .hub   { animation: pulse   3s ease-in-out infinite; }
    .flick { animation: flicker 6s ease-in-out infinite; }
    .fl2   { animation: flicker 9s ease-in-out infinite 2s; }
    .fl3   { animation: flicker 7s ease-in-out infinite 4s; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <radialGradient id="bg" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="100%" stop-color="#040310"/>
    </radialGradient>
  </defs>

