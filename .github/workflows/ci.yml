name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run black
        run: uv run black --check src tests

      - name: Run isort
        run: uv run isort --check-only src tests

      - name: Run mypy
        run: uv run mypy src

      - name: Run pytest
        run: uv run pytest
