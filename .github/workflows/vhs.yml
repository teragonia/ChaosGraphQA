name: Update demo GIFs

on:
  push:
    branches: [main]
    paths:
      - "assets/tapes/**"
      - "src/cgqa/cli/**"
  workflow_dispatch:

jobs:
  vhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cgqa
        run: uv sync --extra dev

      - name: Install VHS and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o /usr/local/bin/ttyd && chmod +x /usr/local/bin/ttyd
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.9.0/vhs_0.9.0_Linux_x86_64.tar.gz \
            | tar xz -C /tmp && sudo mv /tmp/vhs /usr/local/bin/vhs

      - name: Add uv venv to PATH so cgqa is available to VHS
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Record generate demo
        run: vhs assets/tapes/generate.tape

      - name: Record evaluate demo
        run: vhs assets/tapes/evaluate.tape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated GIFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate demo GIFs"
          file_pattern: "assets/*.gif"
