name: Update demo GIFs

on:
  push:
    branches: [main]
    paths:
      - "assets/tapes/**"
      - "src/cgqa/cli/**"
  workflow_dispatch:

jobs:
  vhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cgqa
        run: uv sync --extra dev --extra llm

      - name: Install VHS and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o /usr/local/bin/ttyd && sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Add uv venv to PATH so cgqa is available to VHS
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Record generate demo
        run: vhs assets/tapes/generate.tape

      - name: Generate benchmark for evaluate demo
        run: |
          uv run cgqa generate \
            --generator-type multihop --complexity 2 \
            --num-questions 2 --seed 42 \
            --output /tmp/demo.json

      - name: Record evaluate demo
        run: |
          echo "export ANTHROPIC_API_KEY='${ANTHROPIC_API_KEY}'" >> ~/.bashrc
          vhs assets/tapes/evaluate.tape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated GIFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate demo GIFs"
          file_pattern: "assets/*.gif"
